<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Salam Consulting | Resume Database</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#f6f9fa;color:#173942;font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}.btn{border-radius:8px;padding:10px 15px;font-weight:600;border:1px solid #dde8eb;background:white;color:#22505b;display:inline-flex;align-items:center;justify-content:center;gap:7px}.primary{background:#248b9c;color:white;border-color:#248b9c}.btn:hover{filter:brightness(.96)}.sidebtn{padding:12px 14px;width:100%;text-align:left;border:0;background:transparent;color:#54717a;display:flex;gap:11px;align-items:center;border-radius:9px;font-weight:550}.sidebtn.active{background:#e2f2f3;color:#177f8e;font-weight:700}.sidebtn:hover{background:#eaf5f5}.field{background:white;border:1px solid #dae6e9;border-radius:8px;padding:10px 12px;outline:none;min-width:0;width:100%;color:#244651}.field:focus{border-color:#2494a0;box-shadow:0 0 0 2px #d8f1f2}.panel{background:white;border:1px solid #e1eaed;border-radius:12px;box-shadow:0 2px 10px #123f4806}.muted{color:#718b93}.tiny{font-size:11px}.pill{display:inline-block;background:#edf5f6;color:#40747b;border-radius:5px;padding:4px 8px;font-size:11px;font-weight:550;margin:2px}.thead{background:#f8fafb;font-size:11px;color:#69838c;text-transform:uppercase;letter-spacing:.07em}td,th{padding:14px 12px;text-align:left;border-bottom:1px solid #edf1f2}tr:last-child td{border-bottom:0}tbody tr{cursor:pointer}tbody tr:hover{background:#f5fafb}.circle{height:35px;width:35px;border-radius:50%;display:grid;place-items:center;background:#e0f2f2;color:#288b94;font-weight:750;font-size:11px;flex-shrink:0}.navfoot{font-size:12px;color:#728c94}.bar{height:6px;background:#e5f0f1;border-radius:5px;overflow:hidden}.bar>div{height:100%;background:#2393a0}.modalcover{position:fixed;inset:0;background:#16343b89;z-index:20;display:flex;align-items:center;justify-content:center;padding:14px}.modal{background:white;border-radius:14px;box-shadow:0 18px 50px #102b3060;width:100%;max-width:560px;padding:24px;max-height:90vh;overflow:auto}.tagcheck{background:white;border:1px solid #dae7e9;border-radius:7px;padding:7px 11px;color:#54727b;font-size:12px}.tagcheck.selected{background:#e2f3f3;color:#187e89;border-color:#7ec2c8}.sideinner{display:flex;flex-direction:column;height:100%;padding:22px 15px}.statnum{font-size:28px;font-weight:750;letter-spacing:-1px}.mobile-nav{display:none}.notice{padding:11px 13px;border:1px solid #bee1e3;border-radius:8px;background:#eef9f9;color:#287881;font-size:12px}@media(max-width:800px){.sidebar{display:none}.mobile-nav{display:flex}.desktop-title{font-size:22px!important}.statgrid{grid-template-columns:repeat(2,minmax(0,1fr))!important}.gridmatch{grid-template-columns:1fr!important}.hide-mobile{display:none!important}td,th{padding:10px 8px}.contentpad{padding:15px!important}.topbar{padding:12px 16px!important}}
</style>
</head>
<body>
<div id="salam-app" class="min-h-screen flex flex-col">
<header class="topbar flex items-center justify-between bg-white border-b border-[#e2ebed] px-7 py-4 gap-3">
<div class="flex items-center gap-3">
<svg width="38" height="43" viewBox="0 0 50 55" fill="none" aria-label="Salam logo"><path d="M16 5C35 3 46 17 44 34C42 45 34 51 23 53C34 43 39 31 33 20C28 10 17 11 10 11Z" fill="#50AFAE"/><path d="M15 16C16 26 29 26 29 36M14 25C14 36 21 37 17 50M6 10L9 3L12 10L19 12L12 15L9 22L6 15L0 12Z" stroke="#50AFAE" stroke-width="3" stroke-linecap="round"/></svg>
<div><div class="font-extrabold text-[#27939d] tracking-[.14em] text-[13px]">SALAM CONSULTING</div><div class="text-[10px] tracking-[.26em] text-[#4b9ea7] font-bold">HUMAN DRIVEN</div></div>
</div>
<div class="flex items-center gap-3"><span class="hide-mobile text-xs text-[#759097]">Recruitment Management Platform</span><span class="text-[10px] rounded-full bg-[#eaf6f6] text-[#22888e] px-2 py-1 font-bold">UI DEMO</span><div class="circle" style="background:#d4eef0">SC</div></div>
</header>
<div class="flex flex-1 min-h-0">
<aside class="sidebar bg-white border-r border-[#e5edef] w-[220px] shrink-0"><div class="sideinner"><div class="uppercase tiny muted font-bold tracking-[.14em] px-3 mt-3 mb-3">Workspace</div><div class="space-y-1"><button class="sidebtn active" data-page="overview">▦ Overview</button><button class="sidebtn" data-page="library">▤ Resume Library</button><button class="sidebtn" data-page="matching">◎ AI Candidate Matching</button><button class="sidebtn" data-page="saved">▣ Saved Shortlists</button></div><div class="mt-9 uppercase tiny muted font-bold tracking-[.14em] px-3 mb-3">Management</div><button class="sidebtn" data-page="uploads">⇧ Upload Resumes</button><button class="sidebtn" data-page="settings">⚙ Settings</button><div class="mt-auto pt-8 px-3 navfoot">Salam Consulting<br>Recruiter Workspace<br><span class="text-[10px]">Prototype · v1.0</span></div></div></aside>
<main class="flex-1 min-w-0"><div class="mobile-nav gap-1 overflow-x-auto border-b bg-white px-3 py-2"><button class="sidebtn active" data-page="overview" style="width:auto">Overview</button><button class="sidebtn" data-page="library" style="width:auto">Library</button><button class="sidebtn" data-page="matching" style="width:auto">Matching</button><button class="sidebtn" data-page="uploads" style="width:auto">Upload</button></div><div class="contentpad p-7 max-w-[1240px] mx-auto space-y-5" id="screen"></div></main>
</div><div id="modalroot"></div><div id="toast" role="status" class="hidden fixed bottom-5 right-5 px-5 py-3 rounded-lg bg-[#183f48] text-white shadow-lg text-sm z-50"></div>
</div>
<script>
(function(){
const root=document.getElementById('salam-app'),screen=root.querySelector('#screen'),modals=root.querySelector('#modalroot');
const seeded=[
{id:1,name:'Alex Morgan',title:'Senior Software Engineer',loc:'Washington, DC',exp:8,skills:['Python','AWS','React','SQL','Docker'],education:'B.S. Computer Science',cert:'AWS Solutions Architect',initials:'AM',date:'Oct 18, 2026',source:'Referral'},
{id:2,name:'Jordan Lee',title:'Cybersecurity Analyst',loc:'Arlington, VA',exp:5,skills:['Cybersecurity','Python','SIEM','Splunk','Network+'],education:'B.S. Cybersecurity',cert:'CompTIA Security+',initials:'JL',date:'Oct 16, 2026',source:'LinkedIn'},
{id:3,name:'Taylor Brooks',title:'Data Analyst',loc:'Fairfax, VA',exp:3,skills:['SQL','Python','Power BI','Excel','Tableau'],education:'B.S. Data Analytics',cert:'PL-300',initials:'TB',date:'Oct 15, 2026',source:'Website'},
{id:4,name:'Casey Rivera',title:'Cloud Solutions Architect',loc:'Remote',exp:10,skills:['AWS','Azure','Terraform','Docker','Kubernetes'],education:'M.S. Information Systems',cert:'AWS Professional',initials:'CR',date:'Oct 12, 2026',source:'Referral'},
{id:5,name:'Sam Patel',title:'IT Support Specialist',loc:'Sterling, VA',exp:2,skills:['Networking','Windows','Linux','Help Desk','Network+'],education:'A.S. Information Technology',cert:'CompTIA A+',initials:'SP',date:'Oct 11, 2026',source:'LinkedIn'},
{id:6,name:'Riley Chen',title:'Full Stack Developer',loc:'Alexandria, VA',exp:6,skills:['JavaScript','React','Node.js','SQL','AWS'],education:'B.S. Software Engineering',cert:'AWS Cloud Practitioner',initials:'RC',date:'Oct 10, 2026',source:'Website'},
{id:7,name:'Morgan Davis',title:'Project Manager',loc:'Washington, DC',exp:7,skills:['Agile','Scrum','Jira','Leadership','Excel'],education:'MBA',cert:'PMP',initials:'MD',date:'Oct 09, 2026',source:'Referral'},
{id:8,name:'Jamie Wilson',title:'Security Engineer',loc:'Reston, VA',exp:4,skills:['Cybersecurity','AWS','Linux','Python','SIEM'],education:'B.S. Information Security',cert:'CompTIA Security+',initials:'JW',date:'Oct 08, 2026',source:'Website'}
];
let candidates=seeded.slice(),page='overview',query='',skill='',minexp='',location='',saved=new Set(),matching=[],uploadHistory=[],view='all',toastTimer;
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const title=(a,b)=>'<div class="flex flex-wrap justify-between items-start gap-3"><div><div class="text-[25px] desktop-title font-bold tracking-tight text-[#173c46]">'+a+'</div><p class="muted mt-1 text-[13px]">'+b+'</p></div></div>';
const initials=c=>'<span class="circle">'+escapeHTML(c.initials)+'</span>';
function toast(t){const n=root.querySelector('#toast');n.textContent=t;n.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.classList.add('hidden'),2700)}
function filtered(){return candidates.filter(c=>{let hay=(c.name+' '+c.title+' '+c.loc+' '+c.skills.join(' ')+' '+c.cert+' '+c.education).toLowerCase();return (!query||query.toLowerCase().split(/\s+/).every(w=>hay.includes(w)))&&(!skill||c.skills.some(s=>s.toLowerCase().includes(skill.toLowerCase())))&&(!minexp||c.exp>=Number(minexp))&&(!location||c.loc.toLowerCase().includes(location.toLowerCase()))&&(view!=='saved'||saved.has(c.id))})}
function stats(){return '<div class="statgrid grid grid-cols-4 gap-3">'+[['Total Resumes',candidates.length,'▤'],['Saved Candidates',saved.size,'☆'],['Job Match Searches',matching.length?'1':'0','◎'],['Recent Uploads',uploadHistory.length,'⇧']].map(([a,b,ic])=>'<div class="panel p-4"><div class="flex justify-between muted text-xs"><span>'+a+'</span><span class="text-[#2994a1] text-lg">'+ic+'</span></div><div class="statnum mt-2">'+b+'</div><div class="tiny muted mt-1">Demo workspace</div></div>').join('')+'</div>'}
function candidateRows(data){return '<div class="overflow-x-auto"><table class="w-full border-collapse min-w-[680px]"><thead><tr class="thead"><th>Candidate</th><th>Skills / Expertise</th><th>Experience</th><th>Location</th><th>Action</th></tr></thead><tbody>'+data.map(c=>'<tr data-candidate="'+c.id+'"><td><div class="flex items-center gap-3">'+initials(c)+'<div><div class="font-bold text-[#294b55]">'+escapeHTML(c.name)+'</div><div class="tiny muted mt-1">'+escapeHTML(c.title)+'</div></div></div></td><td><div style="max-width:245px">'+c.skills.slice(0,3).map(s=>'<span class="pill">'+escapeHTML(s)+'</span>').join('')+'<span class="tiny muted">'+(c.skills.length>3?' +'+(c.skills.length-3):'')+'</span></div></td><td class="text-[#46616a]">'+c.exp+' years</td><td class="text-[#607c84] text-xs">'+escapeHTML(c.loc)+'</td><td><button class="text-[#248e9a] font-semibold text-xs hover:underline" data-open="'+c.id+'">View Profile →</button></td></tr>').join('')+'</tbody></table>'+(data.length?'':'<div class="text-center p-12 muted">No matching candidates. Try adjusting your filters.</div>')+'</div>'}
function libraryBlock(isOverview){let rows=filtered();return '<div class="panel overflow-hidden"><div class="p-5 border-b border-[#e7eff1] flex justify-between items-center gap-3"><div><div class="font-bold text-base">'+(isOverview?'Recent Candidates':'Candidate Library')+'</div><div class="muted tiny mt-1">'+rows.length+' matching resume records</div></div>'+(isOverview?'<button class="text-[#258a97] font-semibold text-xs" data-go="library">View All Candidates →</button>':'<button class="btn" id="resetFilters">Clear Filters</button>')+'</div>'+candidateRows(isOverview?rows.slice(0,5):rows)+'</div>'}
function filterUI(){return '<div class="panel p-4 space-y-3"><div class="flex items-center justify-between"><div class="font-bold text-[13px]">Search & Filter Candidates</div><span class="tiny muted">Keyword and category search</span></div><div class="grid grid-cols-1 md:grid-cols-4 gap-3"><div class="md:col-span-2"><input id="searchBox" class="field" placeholder="⌕ Search by name, skill, job title, certification..." value="'+escapeHTML(query)+'"></div><select id="skillFilter" class="field"><option value="">All Skill Categories</option>'+['Python','Cybersecurity','AWS','SQL','React','Networking','Linux','Excel','Docker'].map(s=>'<option '+(skill===s?'selected':'')+'>'+s+'</option>').join('')+'</select><select id="expFilter" class="field"><option value="">Any Experience</option>'+[1,3,5,8].map(n=>'<option value="'+n+'" '+(minexp==n?'selected':'')+'>'+n+'+ Years Experience</option>').join('')+'</select></div><div class="flex items-center gap-2 flex-wrap"><span class="tiny muted mr-1">Quick filters:</span>'+['Cybersecurity','Python','AWS','SQL'].map(s=>'<button class="tagcheck '+(skill===s?'selected':'')+'" data-quickskill="'+s+'">'+s+'</button>').join('')+'<input id="locationFilter" class="field" placeholder="Filter by location" style="max-width:170px;padding:7px 10px;font-size:12px" value="'+escapeHTML(location)+'"></div></div>'}
function overview(){return '<div class="flex flex-wrap items-center justify-between gap-3">'+title('Welcome to Salam Recruiting','Manage resumes and discover qualified candidates in one place.')+'<button class="btn primary" data-go="uploads">＋ Upload Resumes</button></div>'+stats()+'<div class="rounded-xl bg-[#258b9b] text-white p-6 flex flex-wrap justify-between items-center gap-4"><div><div class="text-xl font-bold">Find the right talent, faster.</div><p class="text-[13px] mt-2 text-[#e1f5f6] max-w-[480px]">Search candidate expertise, organize resumes, and explore job-description matching through one streamlined workspace.</p></div><button class="btn" data-go="matching">◎ Find Matching Candidates →</button></div>'+filterUI()+libraryBlock(true)}
function library(){return '<div class="flex flex-wrap gap-3 items-center justify-between">'+title('Resume Library','Browse, search and filter the complete candidate database.')+'<button class="btn primary" data-go="uploads">＋ Add New Resume</button></div>'+filterUI()+libraryBlock(false)}
function matchPage(){return title('AI Candidate Matching','Find candidates that best align with your job requirements.')+'<div class="gridmatch grid grid-cols-[minmax(0,1.15fr)_minmax(260px,.85fr)] gap-4"><div class="panel p-5"><div class="font-bold text-base mb-1">Job Requirements</div><p class="muted text-xs mb-5">Enter a role and job description to explore candidate matches.</p><label class="text-xs font-bold">Job Title</label><input id="jobTitle" class="field mt-2 mb-4" placeholder="e.g. Cybersecurity Analyst"><label class="text-xs font-bold">Job Description</label><textarea id="jobDesc" class="field mt-2 mb-4" rows="8" placeholder="Paste the job description here. Include required skills, tools, qualifications, and years of experience."></textarea><div class="flex gap-2 flex-wrap"><button id="runMatch" class="btn primary">◎ Find Top Candidates</button><button id="sampleJD" class="btn">Use Example Job</button></div><div class="notice mt-4">Matching in this prototype uses local keyword overlap to illustrate the UI. Production AI scoring and explanations require a backend.</div></div><div class="panel p-5"><div class="font-bold text-base">How Candidate Matching Works</div><p class="muted text-xs mt-1 mb-6">Planned workflow from the project document</p>'+[['01','Analyze requirements','Extract job skills, experience, and qualifications'],['02','Search the database','Combine keywords, semantic retrieval, and filters'],['03','Rank candidates','Apply an evidence-based scoring rubric'],['04','Review the shortlist','Inspect top matches and missing qualifications']].map(([i,a,b])=>'<div class="flex gap-3 mb-6"><div class="circle">'+i+'</div><div><div class="font-semibold">'+a+'</div><div class="muted text-xs mt-1">'+b+'</div></div></div>').join('')+'</div></div><div id="matchResults"></div>'}
function uploads(){return title('Upload Resumes','Add individual or multiple candidate resumes to your library.')+'<div class="panel p-6"><div class="text-lg font-bold">Import Candidate Resumes</div><p class="muted text-xs mt-1">Select files or drag and drop resumes below.</p><div id="dropzone" class="border-2 border-dashed border-[#aad1d6] rounded-xl text-center py-14 px-4 bg-[#f9fdfd] mt-6 cursor-pointer"><div class="text-[#24909b] text-4xl mb-2">⇧</div><div class="font-bold">Drag and drop your resumes here</div><div class="muted text-xs my-3">Supported formats: PDF, DOCX · Multiple files allowed</div><button class="btn primary" id="chooseFiles">Browse Files</button><input id="fileInput" type="file" accept=".pdf,.docx" multiple hidden></div><div class="notice mt-5">Demo mode: files can be selected and displayed in the upload queue, but they are not stored or parsed into candidate profiles.</div><div id="uploadStatus" class="mt-5"></div></div>'}
function savedPage(){view='saved';return title('Saved Shortlists','Candidates bookmarked for future recruiter review.')+'<div class="panel"><div class="p-5 font-bold border-b border-[#e5ebee]">'+saved.size+' Saved Candidates</div>'+candidateRows(candidates.filter(c=>saved.has(c.id)))+'</div>'}
function settings(){return title('Workspace Settings','Configuration and permissions for the recruiter portal.')+'<div class="panel p-6 space-y-5"><div class="font-bold text-lg">Recruiter Access</div><div class="notice">The login and security controls below are visual placeholders. Authentication and permissions are not active in this prototype.</div><div class="grid md:grid-cols-2 gap-4">'+[['Organization','Salam Consulting'],['User Role','Recruiter'],['Database','Not Connected'],['Resume Storage','Not Connected']].map(([a,b])=>'<div><div class="muted tiny mb-2">'+a+'</div><div class="field">'+b+'</div></div>').join('')+'</div><div class="font-bold pt-3">Planned Security Features</div><div class="text-sm muted">Role-based access · Private resume storage · Audit logging · Candidate consent and deletion requests</div></div>'}
function navigate(p){page=p;view=p==='saved'?'saved':'all';render()}
function render(){root.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));screen.innerHTML=({overview,library,matching:matchPage,uploads,saved:savedPage,settings})[page]();if(page==='matching'&&matching.length)showMatches();bindPage()}
function bindPage(){const q=screen.querySelector('#searchBox');if(q)q.addEventListener('input',e=>{query=e.target.value;updateLibrary()});const sk=screen.querySelector('#skillFilter');if(sk)sk.addEventListener('change',e=>{skill=e.target.value;updateLibrary()});const ex=screen.querySelector('#expFilter');if(ex)ex.addEventListener('change',e=>{minexp=e.target.value;updateLibrary()});const lo=screen.querySelector('#locationFilter');if(lo)lo.addEventListener('input',e=>{location=e.target.value;updateLibrary()});screen.querySelectorAll('[data-quickskill]').forEach(b=>b.addEventListener('click',()=>{skill=skill===b.dataset.quickskill?'':b.dataset.quickskill;updateLibrary(true)}));screen.querySelector('#resetFilters')?.addEventListener('click',()=>{query=skill=minexp=location='';render()});screen.querySelector('#sampleJD')?.addEventListener('click',()=>{screen.querySelector('#jobTitle').value='Cybersecurity Analyst';screen.querySelector('#jobDesc').value='Seeking a Cybersecurity Analyst with experience in Python, SIEM, AWS, Linux, network security, and incident response. CompTIA Security+ is preferred. Minimum 3 years of relevant experience.'});screen.querySelector('#runMatch')?.addEventListener('click',runMatching);screen.querySelector('#chooseFiles')?.addEventListener('click',()=>screen.querySelector('#fileInput').click());screen.querySelector('#fileInput')?.addEventListener('change',e=>queueFiles(e.target.files));let d=screen.querySelector('#dropzone');if(d){d.addEventListener('dragover',e=>{e.preventDefault();d.style.background='#e8f6f6'});d.addEventListener('dragleave',()=>d.style.background='');d.addEventListener('drop',e=>{e.preventDefault();d.style.background='';queueFiles(e.dataTransfer.files)})}}
function updateLibrary(full){let p=screen.querySelector('.panel:has(table)');if(p){let replacement=document.createElement('div');replacement.innerHTML=libraryBlock(page==='overview');p.replaceWith(replacement.firstElementChild);screen.querySelector('#resetFilters')?.addEventListener('click',()=>{query=skill=minexp=location='';render()})}if(full){const sk=screen.querySelector('#skillFilter');if(sk)sk.value=skill;screen.querySelectorAll('[data-quickskill]').forEach(b=>b.classList.toggle('selected',skill===b.dataset.quickskill))}}
function queueFiles(files){let arr=Array.from(files||[]);const valid=arr.filter(f=>/\.(pdf|docx)$/i.test(f.name));if(valid.length!==arr.length)toast('Only PDF and DOCX files are supported');if(!valid.length)return;uploadHistory.push(...valid.map(f=>f.name));screen.querySelector('#uploadStatus').innerHTML='<div class="font-bold mb-3">Selected Files ('+valid.length+')</div>'+valid.map(f=>'<div class="border-b border-[#e7ebee] py-3 flex items-center justify-between gap-3"><span class="truncate">📄 '+escapeHTML(f.name)+'</span><span class="tiny muted shrink-0">Ready · Demo only</span></div>').join('');toast(valid.length+' file(s) added to demo upload queue')}
function runMatching(){const text=(screen.querySelector('#jobTitle').value+' '+screen.querySelector('#jobDesc').value).toLowerCase();if(text.trim().length<18){toast('Please provide a role and job description');return}const words=text.match(/[a-z][a-z0-9+#.-]*/g)||[];const stop=new Set(['and','with','the','for','are','our','you','years','experience','seeking','candidate','minimum','preferred','role','skills','required','have','work','job','strong','knowledge']);let terms=[...new Set(words.filter(w=>w.length>2&&!stop.has(w)))];matching=candidates.map(c=>{const corpus=(c.title+' '+c.skills.join(' ')+' '+c.cert+' '+c.education).toLowerCase();let hits=terms.filter(w=>corpus.includes(w));let skillhits=c.skills.filter(s=>text.includes(s.toLowerCase()));let score=Math.min(99,Math.round((hits.length/Math.max(1,terms.length))*.65*100+(skillhits.length/Math.max(1,c.skills.length))*.35*100));return {...c,score,hits:skillhits}}).sort((a,b)=>b.score-a.score).slice(0,5);showMatches()}
function showMatches(){const m=screen.querySelector('#matchResults');if(!m)return;m.innerHTML='<div class="mt-6 flex justify-between items-center"><div><div class="text-lg font-bold">Top Candidate Matches</div><div class="muted text-xs mt-1">Illustrative keyword relevance · '+matching.length+' results</div></div></div><div class="grid md:grid-cols-2 gap-3 mt-3">'+matching.map(c=>'<div class="panel p-5"><div class="flex justify-between gap-3"><div class="flex gap-3">'+initials(c)+'<div><div class="font-bold">'+escapeHTML(c.name)+'</div><div class="muted text-xs">'+escapeHTML(c.title)+'</div></div></div><div class="text-right"><div class="text-xl font-bold text-[#178695]">'+c.score+'%</div><div class="tiny muted">Demo score</div></div></div><div class="bar mt-4 mb-4"><div style="width:'+c.score+'%"></div></div><div class="tiny muted mb-2">Skills identified in job description</div><div class="min-h-[29px]">'+(c.hits.length?c.hits.map(s=>'<span class="pill">'+escapeHTML(s)+'</span>').join(''):'<span class="tiny muted">No direct skill overlap</span>')+'</div><button class="text-xs text-[#248c9a] font-bold mt-4" data-open="'+c.id+'">View Candidate →</button></div>').join('')+'</div><p class="muted tiny mt-3">These percentages are simple keyword-overlap indicators for UI demonstration, not calibrated recruiter match scores.</p>'}
function profile(id){let c=candidates.find(x=>x.id==id);if(!c)return;const isSaved=saved.has(c.id);modals.innerHTML='<div class="modalcover"><div class="modal"><div class="flex justify-between gap-3 items-center"><div class="flex gap-3 items-center">'+initials(c)+'<div><div class="font-bold text-lg">'+escapeHTML(c.name)+'</div><div class="muted text-xs">'+escapeHTML(c.title)+'</div></div></div><button class="btn" data-close>✕</button></div><div class="grid grid-cols-2 gap-3 my-6 text-xs"><div class="bg-[#f3f9fa] p-3 rounded-lg"><div class="muted mb-1">Experience</div><b>'+c.exp+' years</b></div><div class="bg-[#f3f9fa] p-3 rounded-lg"><div class="muted mb-1">Location</div><b>'+escapeHTML(c.loc)+'</b></div><div class="bg-[#f3f9fa] p-3 rounded-lg"><div class="muted mb-1">Education</div><b>'+escapeHTML(c.education)+'</b></div><div class="bg-[#f3f9fa] p-3 rounded-lg"><div class="muted mb-1">Certification</div><b>'+escapeHTML(c.cert)+'</b></div></div><div class="font-bold mb-2">Skills & Expertise</div><div>'+c.skills.map(s=>'<span class="pill">'+escapeHTML(s)+'</span>').join('')+'</div><div class="font-bold mt-6 mb-2">Resume Preview</div><div class="border border-dashed rounded-lg text-center py-9 bg-[#fbfdfd]"><div class="text-3xl text-[#a4bec3]">▤</div><div class="text-sm muted mt-2">Original resume preview placeholder</div><div class="tiny muted mt-1">Will display uploaded PDF or DOCX in the full application</div></div><div class="flex justify-end gap-3 mt-6"><button class="btn" data-close>Close</button><button class="btn primary" id="saveCandidate">'+(isSaved?'★ Remove from Shortlist':'☆ Save to Shortlist')+'</button></div></div></div>';modals.querySelector('#saveCandidate').addEventListener('click',()=>{if(saved.has(c.id))saved.delete(c.id);else saved.add(c.id);profile(c.id);if(page!=='matching')render();toast(saved.has(c.id)?'Candidate saved to shortlist':'Candidate removed from shortlist')})}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(b?.dataset.page){navigate(b.dataset.page);return}if(b?.dataset.go){navigate(b.dataset.go);return}if(b?.dataset.open){profile(b.dataset.open);return}if(e.target.closest('[data-candidate]')){profile(e.target.closest('[data-candidate]').dataset.candidate);return}if(e.target.closest('[data-close]')||e.target.classList.contains('modalcover'))modals.innerHTML=''});
render();
})();
</script>
</body>
</html>
